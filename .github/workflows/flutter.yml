name: flutter

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'refactor/**']

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nginx-proxy:
    name: Nginx proxy runtime tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify runtime proxy headers and responses
        run: python3 src/IntoChat.OS.Modules/Google/Flutter/app/shell/test/nginx_proxy_test.py -v

  flutter:
    name: Flutter analyze and web build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/IntoChat.OS.Modules/Google/Flutter/app/shell
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Resolve Flutter workspace
        working-directory: src/IntoChat.OS.Modules/Google/Flutter/app
        run: flutter pub get --enforce-lockfile

      - name: Dart format
        working-directory: src/IntoChat.OS.Modules/Google/Flutter/app
        run: dart format --output=none --set-exit-if-changed core ui shell

      - name: Analyze Flutter packages
        working-directory: src/IntoChat.OS.Modules/Google/Flutter/app
        run: |
          (cd core && dart analyze --fatal-infos)
          (cd ui && flutter analyze --no-pub)
          (cd shell && flutter analyze --no-pub)

      - name: Web release build
        run: flutter build web --release --base-href "/" --no-tree-shake-icons --no-pub

      - name: Flutter widget and client tests
        working-directory: src/IntoChat.OS.Modules/Google/Flutter/app
        run: |
          (cd core && flutter test --no-pub)
          (cd ui && flutter test --no-pub --exclude-tags golden)
          (cd shell && flutter test --no-pub)
