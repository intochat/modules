name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'refactor/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CI: 'true'

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Authenticate GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source github --username "${{ github.actor }}" --password "${GITHUB_TOKEN}" --store-password-in-clear-text --configfile nuget.config

      - name: Restore dependencies
        run: dotnet restore IntoChat.Modules.slnx -v quiet

      - name: Format code
        run: dotnet format whitespace IntoChat.Modules.slnx --verify-no-changes --no-restore --verbosity minimal

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Authenticate GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source github --username "${{ github.actor }}" --password "${GITHUB_TOKEN}" --store-password-in-clear-text --configfile nuget.config

      - name: Build solution
        run: dotnet build IntoChat.Modules.slnx -c Release -v quiet -p:CodeGraphRefresh=false

      - name: Test modules
        run: dotnet test IntoChat.Modules.slnx -c Release --no-build -p:CodeGraphRefresh=false

      - name: Test architecture facts
        run: dotnet test --project tests/IntoChat.Modules.Architecture.Tests.Unit/IntoChat.Modules.Architecture.Tests.Unit.csproj -c Release --no-build -p:CodeGraphRefresh=false

      - name: Validate NuGet packages
        run: dotnet pack IntoChat.Modules.slnx -c Release --no-build -v quiet -o artifacts/packages -p:CodeGraphRefresh=false

  ci:
    name: ci
    needs: [format, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Gate
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "format=${{ needs.format.result }} build=${{ needs.build.result }}"
          exit 1

  publish:
    name: publish
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Authenticate GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source github --username "${{ github.actor }}" --password "${GITHUB_TOKEN}" --store-password-in-clear-text --configfile nuget.config

      - name: Version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "version=$(tr -d '[:space:]' < VERSION)-pre.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Pack prerelease packages
        run: dotnet pack IntoChat.Modules.slnx -c Release -o artifacts -p:CodeGraphRefresh=false -p:VersionSuffix=pre.${{ github.run_number }}

      - name: Push packages to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "artifacts/*.nupkg" --source https://nuget.pkg.github.com/intochat/index.json --api-key "${GITHUB_TOKEN}" --skip-duplicate

      - name: Notify consumers
        env:
          GH_TOKEN: ${{ secrets.OS_DOWNSTREAM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh api repos/intochat/os/dispatches -f event_type=modules-published -F client_payload[version]="${VERSION}"
