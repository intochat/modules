name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'refactor/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CI: 'true'

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Populate NuGet packages from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(tr -d '[:space:]' < VERSION)"
          mkdir -p ../nuget
          gh release download "${version}" --repo intochat/digitalbrain -p "*.nupkg" -D ../nuget --clobber
          gh release download "${version}" --repo intochat/modules -p "*.nupkg" -D ../nuget --clobber

      - name: Restore dependencies
        run: dotnet restore IntoChat.Modules.slnx -v quiet

      - name: Format code
        run: dotnet format whitespace IntoChat.Modules.slnx --verify-no-changes --no-restore --verbosity minimal

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Populate NuGet packages from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(tr -d '[:space:]' < VERSION)"
          mkdir -p ../nuget
          gh release download "${version}" --repo intochat/digitalbrain -p "*.nupkg" -D ../nuget --clobber
          gh release download "${version}" --repo intochat/modules -p "*.nupkg" -D ../nuget --clobber

      - name: Build solution
        run: dotnet build IntoChat.Modules.slnx -c Release -v quiet -p:CodeGraphRefresh=false

      - name: Test modules
        run: dotnet test IntoChat.Modules.slnx -c Release --no-build -p:CodeGraphRefresh=false

      - name: Validate NuGet packages
        run: dotnet pack IntoChat.Modules.slnx -c Release --no-build -v quiet -o artifacts/packages -p:CodeGraphRefresh=false

  ci:
    name: ci
    needs: [format, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Gate
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "format=${{ needs.format.result }} build=${{ needs.build.result }}"
          exit 1
