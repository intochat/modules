name: intochat_os_ui
description: >
  Shared UI components for IntoChat.OS Flutter host. One widget family per component
  (button, chart, card, …), usable in surfaces and inside flutter_chat_ui
  CustomMessage bubbles.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  intochat_os_flutter:
    path: ../core
  forui: ^0.26.0
  material_ui: ^1.2.0
  gpt_markdown: ^1.2.1
  flutter_svg: ^2.3.0
  flutter_chat_core: ^2.9.0
  flutter_chat_ui: ^2.11.1
  record: ^7.1.1
  path_provider: ^2.1.6
  web: ^1.1.1
  http: ^1.6.0
  file_picker: ^8.3.7
  url_launcher: ^6.3.2
  webview_windows: ^0.4.0
  fl_chart: ^1.2.0
  flame: ^1.38.2
  flame_behavior_tree: ^0.1.5+5
  lucide_icons_flutter: 4.0.1

dev_dependencies:
  flame_test: ^2.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brands/aspire-icon-32.svg
    - assets/brands/gmail.svg
    - assets/brands/salesforce.svg
    - assets/brands/github.svg
  fonts:
    - family: Schibsted Grotesk
      fonts:
        - asset: assets/fonts/SchibstedGrotesk-Variable.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
